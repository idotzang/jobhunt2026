name: Factory · fix
on:
  workflow_run:
    workflows: [CI, E2E, Security]
    types: [completed]

# GITHUB_TOKEN stays read-only: labels, comments and pushes use
# FACTORY_GH_TOKEN (a PAT). id-token is not requested (see factory-build.yml).
permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  fix:
    # Only failed gate runs; successes and cancellations never start a job.
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Job-level on purpose: workflow_run fires for every CI/E2E/Security
    # completion, so a workflow-level group would let those events cancel a
    # pending fix run.
    concurrency:
      group: factory-agent
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      FAILED_RUN: ${{ github.event.workflow_run.html_url }}
    steps:
      # Reads PR metadata only; never checks out or runs PR-controlled code.
      # Commit -> PR lookup via the commits API (reliable for open PRs, unlike
      # `gh pr list --search <sha>`, which the gh docs show for merged PRs).
      # Acts only on an open PR whose head branch is ai/* and whose head SHA is
      # exactly the failed run's SHA (stale-event protection), and which is not
      # already labelled needs-human.
      - name: Locate agent PR for this commit
        id: pr
        run: |
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --paginate \
            --jq '.[] | select(.state == "open" and (.head.ref | startswith("ai/")) and .head.sha == env.SHA) | {number, branch: .head.ref, labels: [.labels[].name]}' \
            | head -n 1)
          if [ -z "$pr" ]; then
            echo "No open ai/ PR with head $SHA; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=$(jq -r .number <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r .branch <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "attempts=$(jq '[.labels[] | select(startswith("fix-attempt-"))] | length' <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "needs_human=$(jq '[.labels[] | select(. == "needs-human")] | length' <<<"$pr")" >> "$GITHUB_OUTPUT"
      # needs-human PRs fall through both steps below (attempts >= 2 with the
      # label already set => no comment spam; fewer attempts => skipped here).
      - name: Skip PRs already handed to a human
        if: steps.pr.outputs.skip == 'false' && steps.pr.outputs.needs_human != '0'
        run: echo "PR already has needs-human; nothing to do."
      - name: Give up and ask a human
        if: steps.pr.outputs.skip == 'false' && steps.pr.outputs.attempts >= 2 && steps.pr.outputs.needs_human == '0'
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh label create needs-human --repo "$REPO" --color B60205 2>/dev/null || true
          gh pr edit "$NUMBER" --repo "$REPO" --add-label needs-human
          gh pr comment "$NUMBER" --repo "$REPO" \
            --body "Gates still failing after 2 automatic fix attempts — needs a human look. Failed run: $FAILED_RUN"
      # The label is added BEFORE the skill runs: the workflow, not the skill,
      # enforces the cap of 2 attempts.
      - name: Mark attempt
        id: attempt
        if: steps.pr.outputs.skip == 'false' && steps.pr.outputs.attempts < 2 && steps.pr.outputs.needs_human == '0'
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          ATTEMPTS: ${{ steps.pr.outputs.attempts }}
        run: |
          n=$(( ATTEMPTS + 1 ))
          gh label create "fix-attempt-$n" --repo "$REPO" --color FBCA04 2>/dev/null || true
          gh pr edit "$NUMBER" --repo "$REPO" --add-label "fix-attempt-$n"
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: steps.attempt.outcome == 'success'
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0
          # Credentials must persist: the agent pushes to the PR branch and
          # record-run.sh pushes to factory-log using them.
          token: ${{ secrets.FACTORY_GH_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-node@v5
        if: steps.attempt.outcome == 'success'
        with:
          node-version: 22
          cache: npm
      - if: steps.attempt.outcome == 'success'
        run: npm ci
      - id: claude
        if: steps.attempt.outcome == 'success'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.FACTORY_GH_TOKEN }}
          # PR number is numeric, taken from the GitHub API.
          prompt: "/implement-ticket fix ${{ steps.pr.outputs.number }}"
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
      - name: Record run
        if: always() && steps.attempt.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          SKILL: implement-ticket
          MODE: fix
          MODEL: claude-sonnet-5-5
          PR: ${{ steps.pr.outputs.number }}
          RETRY: ${{ steps.attempt.outputs.n }}
        run: bash scripts/factory/record-run.sh
      - uses: actions/upload-artifact@v5
        if: always() && steps.attempt.outcome == 'success'
        with:
          name: transcript-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: ignore
