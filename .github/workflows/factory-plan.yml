# Factory planner: turns an epic issue into a plan PR (specs + architecture).
#
# Triggers:
#   - `ai-plan` label applied to an issue by the repo owner -> mode `plan`,
#     epic = the issue number.
#   - A comment by the repo owner whose text starts with `/replan` -> mode
#     `replan`. The comment may be on the epic issue (which must carry the
#     `ai-plan` label) or on the plan PR (epic derived from the PR's same-repo
#     head branch, ai/plan-<epic>-...). If no epic can be resolved the job
#     stops with a notice and posts nothing.
#
# Only one agent runs at a time: plan, replan, build and fix runs (factory-build
# and factory-fix too) share the `factory-agent` concurrency group and queue
# behind each other.
#
# `startsWith` ignores case and also matches `/replanning`, so `/Replan` triggers
# too. `/replan` must be at the very start of an issue or PR conversation
# comment (review comments do not trigger).
#
# `/replan` after the plan PR is merged is refused by the plan-epic skill.
#
# Safety: comment bodies, titles and branch names are never interpolated into a
# shell script or the prompt. The prompt is built from the mode word and a
# numeric epic only; everything else goes through `env:`.
name: Factory · plan
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  plan:
    # Gate in expressions only. Label path: owner's `ai-plan` label event.
    # Comment path: `/replan` from the owner (never a bot).
    if: >-
      (github.event_name == 'issues' &&
        github.event.label.name == 'ai-plan' &&
        github.event.sender.login == github.repository_owner &&
        github.event.issue.author_association == 'OWNER') ||
      (github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '/replan') &&
        github.event.comment.user.login == github.repository_owner &&
        github.event.comment.user.type != 'Bot' &&
        github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Job-level on purpose (see factory-build.yml).
    concurrency:
      group: factory-agent
      cancel-in-progress: false
    env:
      EVENT_NAME: ${{ github.event_name }}
      ISSUE: ${{ github.event.issue.number }}
      IS_PR: ${{ github.event.issue.pull_request != null }}
      LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
    steps:
      - id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # Default branch (issue_comment always runs there). In replan mode the
      # skill checks out the plan branch itself using the persisted PAT.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.FACTORY_GH_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Resolve mode and epic
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: |
          mode=plan
          epic=""
          if [ "$EVENT_NAME" = "issues" ]; then
            epic="$ISSUE"
          else
            mode=replan
            if [ "$IS_PR" = "true" ]; then
              head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$ISSUE" \
                --jq 'if .head.repo.full_name == .base.repo.full_name then .head.ref else "" end' || true)
              if [ -n "$head" ]; then
                epic=$(HEAD_REF="$head" node --input-type=module -e \
                  'import { planBranchEpic } from "./scripts/factory/sequence-lib.mjs"; const n = planBranchEpic(process.env.HEAD_REF); if (n) console.log(n);')
              fi
            elif printf '%s' "$LABELS" | node -e \
              'const l = JSON.parse(require("fs").readFileSync(0, "utf8")); process.exit(l.includes("ai-plan") ? 0 : 1)'; then
              epic="$ISSUE"
            fi
          fi
          case "$epic" in
            ''|*[!0-9]*)
              echo "::notice::Could not resolve an epic for this event; nothing to do."
              epic=""
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "epic=$epic" >> "$GITHUB_OUTPUT"
      - id: claude
        if: steps.resolve.outputs.epic != ''
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.FACTORY_GH_TOKEN }}
          # Mode word and numeric epic only.
          prompt: "/plan-epic ${{ steps.resolve.outputs.mode }} ${{ steps.resolve.outputs.epic }}"
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
      # The agent may leave a plan branch checked out; record-run.sh and the
      # redactor must run from the default-branch tree.
      - name: Restore default-branch tree
        if: always()
        run: git checkout --force --detach "$GITHUB_SHA" || true
      - name: Find plan PR
        id: pr
        if: always() && steps.resolve.outputs.epic != ''
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          EPIC: ${{ steps.resolve.outputs.epic }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 100 --json number,headRefName,createdAt \
            -q "map(select(.headRefName | startswith(\"ai/plan-$EPIC-\") or . == \"ai/plan-$EPIC\")) | sort_by(.createdAt) | last | .number // empty" || true)
          echo "number=$pr" >> "$GITHUB_OUTPUT"
      - name: Record run
        if: always() && steps.resolve.outputs.epic != '' && hashFiles('scripts/factory/record-run.sh') != ''
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          ISSUE: ${{ steps.resolve.outputs.epic }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          SKILL: plan-epic
          MODE: ${{ steps.resolve.outputs.mode }}
          MODEL: claude-opus-5-5
          PR: ${{ steps.pr.outputs.number }}
        run: bash scripts/factory/record-run.sh
      - name: Redact secrets from transcript
        id: redact
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          FACTORY_GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node scripts/factory/redact-transcript.mjs "$EXECUTION_FILE"
      - uses: actions/upload-artifact@v5
        if: always() && steps.claude.outputs.execution_file != '' && steps.redact.outcome == 'success'
        with:
          retention-days: 7
          name: transcript-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: ignore
