name: Epic
description: A user-facing outcome. Add the ai-plan label when ready for planning.
title: "Epic: "
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does this solve for me?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Observable outcomes, one per line.
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
