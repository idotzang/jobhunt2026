# Factory sequencer: keeps the epic pipeline moving when an `ai/` PR closes.
# Plain script (scripts/factory/sequence.mjs), no AI involved.
#
# On a merged plan PR: creates the epic's child issues from the merged spec and
# posts the epic index comment.
# On a merged child PR: labels the next ready children `ai-build` (up to
# FACTORY_MAX_IN_FLIGHT), and closes the epic after the last child is done.
# On a child PR closed WITHOUT merging: posts a "paused" comment on the epic and
# stops sequencing until the owner decides.
#
# FACTORY_MAX_IN_FLIGHT (repository variable, default 1): how many children may
# be built at once. Raising it needs a look first: the factory-agent group
# holds only a single pending run, so extra queued builds can be dropped.
#
# Trust model: `pull_request_target` runs with secrets, so we NEVER check out or
# run PR code. The checkout is the default branch by name (not GITHUB_SHA, which
# may predate the merge), so the script sees the merged plan. Everything about
# the PR is read by the script from EVENT_PATH; no event text appears in a
# `run:` script. The script itself re-checks same-repo, owner-merged and ref
# patterns.
#
# FACTORY_GH_TOKEN (PAT) is REQUIRED for every write: labels added with the
# default GITHUB_TOKEN would not trigger factory-build.yml, and the script only
# trusts the epic index comment when it is authored by the repo owner (the PAT
# user). It is passed to the script step only.
name: Factory · sequence
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  sequence:
    name: sequence
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'ai/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level so the group is only claimed by runs that pass the `if`.
    concurrency:
      group: factory-sequence
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sequence
        run: node scripts/factory/sequence.mjs
        env:
          EVENT_PATH: ${{ github.event_path }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          MAX_IN_FLIGHT: ${{ vars.FACTORY_MAX_IN_FLIGHT || '1' }}
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
