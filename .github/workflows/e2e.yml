name: E2E
on: deployment_status

# Least privilege by default; each job grants only what it needs.
permissions: {}

jobs:
  # NOTE: this job publishes a commit status with context `e2e` (not a check
  # run named `e2e`). A skipped job is not a failing check, but a missing
  # required status blocks merging, so the status is always posted: `pending`
  # first, then `success` or `failure` in an `if: always()` step.
  e2e-run:
    name: e2e-run
    if: github.event.deployment_status.state == 'success' && !startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    concurrency:
      group: e2e-${{ github.event.deployment.sha }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.deployment.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report e2e pending
        run: |
          gh api "repos/$REPO/statuses/$SHA" \
            -f state=pending -f context=e2e \
            -f description="e2e running" -f target_url="$RUN_URL"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Only @playwright/test is needed here; skip install scripts from PR code.
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
          BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
      - name: Report e2e result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state=success; desc="e2e passed"
          else
            state=failure; desc="e2e failed"
          fi
          gh api "repos/$REPO/statuses/$SHA" \
            -f state="$state" -f context=e2e \
            -f description="$desc" -f target_url="$RUN_URL"

  prod-health:
    name: prod-health
    if: github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.deployment.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check /api/health
        id: health
        env:
          URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors --max-time 20 "$URL/api/health"
      - name: Open issue on failure
        if: failure() && steps.health.outcome == 'failure'
        run: |
          gh issue create --repo "$REPO" --label bug \
            --title "Production health check failed ($SHA)" \
            --body "Post-deploy health check failed. Run: $RUN_URL"
