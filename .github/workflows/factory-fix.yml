name: Factory · fix
on:
  workflow_run:
    workflows: [CI, E2E, Security]
    types: [completed]

# GITHUB_TOKEN stays read-only: labels, comments and pushes use
# FACTORY_GH_TOKEN (a PAT). id-token is not requested (see factory-build.yml).
permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  fix:
    # Only failed gate runs; successes and cancellations never start a job.
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Job-level on purpose: workflow_run fires for every CI/E2E/Security
    # completion, so a workflow-level group would let those events cancel a
    # pending fix run.
    concurrency:
      group: factory-agent
      cancel-in-progress: false
    # GH_TOKEN (the PAT) is set per step, only where gh needs it, never for
    # npm or the agent's install step.
    env:
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      FAILED_RUN: ${{ github.event.workflow_run.html_url }}
    steps:
      # Reads PR metadata only; never checks out or runs PR-controlled code.
      # Commit -> PR lookup via the commits API (reliable for open PRs, unlike
      # `gh pr list --search <sha>`, which the gh docs show for merged PRs).
      # Acts only on an open PR that (a) lives in THIS repo (not a fork),
      # (b) was authored by the repository owner, (c) has an ai/* head branch,
      # (d) whose head SHA is exactly the failed run's SHA (stale-event
      # protection). A stranger's PR from a branch named ai/x never reaches
      # the PAT-holding agent. API errors skip loudly, distinct from "no PR".
      - name: Locate agent PR for this commit
        id: pr
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        run: |
          if ! raw=$(gh api "repos/$REPO/commits/$SHA/pulls" --paginate); then
            echo "::warning::GitHub API lookup of PRs for $SHA failed; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr=$(jq -c --arg sha "$SHA" --arg repo "$REPO" --arg owner "$OWNER" \
            '.[] | select(.state == "open"
                and (.head.ref | startswith("ai/"))
                and .head.sha == $sha
                and .head.repo != null and .head.repo.full_name == $repo
                and .user.login == $owner)
              | {number, branch: .head.ref, labels: [.labels[].name]}' <<<"$raw" | head -n 1)
          if [ -z "$pr" ]; then
            echo "No open same-repo owner ai/ PR with head $SHA; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "number=$(jq -r .number <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r .branch <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "attempts=$(jq '[.labels[] | select(startswith("fix-attempt-"))] | length' <<<"$pr")" >> "$GITHUB_OUTPUT"
          echo "needs_human=$(jq '[.labels[] | select(. == "needs-human")] | length' <<<"$pr")" >> "$GITHUB_OUTPUT"
      # needs-human PRs fall through both steps below (attempts >= 2 with the
      # label already set => no comment spam; fewer attempts => skipped here).
      - name: Skip PRs already handed to a human
        if: steps.pr.outputs.skip == 'false' && steps.pr.outputs.needs_human != '0'
        run: echo "PR already has needs-human; nothing to do."
      - name: Give up and ask a human
        if: steps.pr.outputs.skip == 'false' && steps.pr.outputs.attempts >= 2 && steps.pr.outputs.needs_human == '0'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh label create needs-human --repo "$REPO" --color B60205 2>/dev/null || true
          gh pr edit "$NUMBER" --repo "$REPO" --add-label needs-human
          gh pr comment "$NUMBER" --repo "$REPO" \
            --body "Gates still failing after 2 automatic fix attempts — needs a human look. Failed run: $FAILED_RUN"
      # Adding a label re-triggers CI on the SAME sha, which queues a second
      # event behind the running agent. Each attempt leaves an owner-authored
      # `fix-attempt-sha:<sha>` comment. Seeing it again for the same head sha
      # (with an attempt label already present) means the agent pushed nothing:
      # escalate instead of burning another attempt. Fail closed on API errors.
      - name: Check whether this sha was already attempted
        id: fresh
        if: steps.pr.outputs.skip == 'false' && steps.pr.outputs.attempts < 2 && steps.pr.outputs.needs_human == '0'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
          ATTEMPTS: ${{ steps.pr.outputs.attempts }}
        run: |
          if ! raw=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate); then
            echo "::warning::Could not read PR comments; skipping fix attempt (fail closed)."
            echo "fresh=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bodies=$(jq -r --arg owner "$OWNER" '.[] | select(.user.login == $owner) | .body' <<<"$raw")
          if grep -qE "fix-attempt-sha:$SHA([^0-9a-f]|$)" <<<"$bodies"; then
            if [ "$ATTEMPTS" -ge 1 ]; then
              echo "fresh=noprogress" >> "$GITHUB_OUTPUT"
            else
              echo "fresh=skip" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Escalate a fix attempt that made no progress
        if: steps.fresh.outputs.fresh == 'noprogress'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh label create needs-human --repo "$REPO" --color B60205 2>/dev/null || true
          gh pr edit "$NUMBER" --repo "$REPO" --add-label needs-human
          gh pr comment "$NUMBER" --repo "$REPO" \
            --body "Fix attempt made no progress on $SHA; needs a human. Failed run: $FAILED_RUN"
      # The marker comment is posted BEFORE the label: if posting fails the
      # step aborts without consuming an attempt. The label is added BEFORE the
      # skill runs: the workflow, not the skill, enforces the cap of 2.
      - name: Mark attempt
        id: attempt
        if: steps.fresh.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
          ATTEMPTS: ${{ steps.pr.outputs.attempts }}
        run: |
          n=$(( ATTEMPTS + 1 ))
          gh pr comment "$NUMBER" --repo "$REPO" \
            --body "Automatic fix attempt $n for failed run $FAILED_RUN. fix-attempt-sha:$SHA"
          gh label create "fix-attempt-$n" --repo "$REPO" --color FBCA04 2>/dev/null || true
          gh pr edit "$NUMBER" --repo "$REPO" --add-label "fix-attempt-$n"
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: steps.attempt.outcome == 'success'
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0
          # Credentials must persist: the agent pushes to the PR branch and
          # record-run.sh pushes to factory-log using them.
          token: ${{ secrets.FACTORY_GH_TOKEN }}
          persist-credentials: true
      # A push may have landed between the failure and now.
      - name: Verify checkout is the failed commit
        if: steps.attempt.outcome == 'success'
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$SHA" ]; then
            echo "::error::Branch moved: checked out $head but the failed run was for $SHA. Aborting."
            exit 1
          fi
      # Diff gate, before any PR-controlled code runs (npm ci, the agent). The
      # agent PR must not change the factory itself or the test/lint/deploy
      # config. Three-dot = diff from the merge base, so a branch that is
      # merely behind the default branch passes. Hits are handed to a human;
      # the job does not fail, and every later step is skipped via gate.ok.
      - name: Gate protected paths
        id: gate
        if: steps.attempt.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          files=$(git diff --name-only "origin/$DEFAULT_BRANCH...HEAD" -- \
            .claude scripts/factory .github CLAUDE.md AGENTS.md \
            vitest.config.mts playwright.config.ts eslint.config.mjs vercel.json)
          if [ -z "$files" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          gh label create needs-human --repo "$REPO" --color B60205 2>/dev/null || true
          gh pr edit "$NUMBER" --repo "$REPO" --add-label needs-human
          gh pr comment "$NUMBER" --repo "$REPO" \
            --body "Agent PR touches protected paths; needs a human. No automatic fix was run. Files: $(head -n 20 <<<"$files" | sed 's/.*/`&`/' | tr '\n' ' ')"
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.ok == 'true'
        run: npm ci --ignore-scripts
      - id: claude
        if: steps.gate.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        # The skill runs gh heavily; export the PAT explicitly to it.
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.FACTORY_GH_TOKEN }}
          # PR number is numeric, taken from the GitHub API.
          prompt: "/implement-ticket fix ${{ steps.pr.outputs.number }}"
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
      - name: Record run
        if: always() && steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_GH_TOKEN }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          SKILL: implement-ticket
          MODE: fix
          MODEL: claude-sonnet-5-5
          PR: ${{ steps.pr.outputs.number }}
          RETRY: ${{ steps.attempt.outputs.n }}
        run: bash scripts/factory/record-run.sh
      - uses: actions/upload-artifact@v5
        if: always() && steps.gate.outputs.ok == 'true' && steps.claude.outputs.execution_file != ''
        with:
          retention-days: 7
          name: transcript-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: ignore
